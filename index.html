<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>太阳系探索器 · Solar System Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffb347'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%236fb6ff' stroke-width='1.6' transform='rotate(-22 16 16)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#04060d;
    --panel:rgba(11,17,30,.78);
    --panel-solid:#0b1120;
    --line:rgba(120,165,235,.16);
    --line-strong:rgba(120,165,235,.32);
    --txt:#e6eefc;
    --muted:#8fa3c2;
    --accent:#6fb6ff;
    --accent2:#ffb454;
    --cyan:#35e0ff;
    --ok:#5fdc9a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased}
  canvas#c{position:fixed;inset:0;display:block;outline:none}

  /* ---------- 加载 ---------- */
  #loading{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 45%,#0b1428 0%,#04060d 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s ease}
  #loading.hide{opacity:0;pointer-events:none}
  .ld-orb{width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#fff6d8,#ffb638 42%,#e0591a 72%,#8a2c06);
    box-shadow:0 0 60px rgba(255,160,60,.55),0 0 140px rgba(255,110,30,.28);
    position:relative;animation:pulse 2.6s ease-in-out infinite}
  .ld-orb:after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px solid rgba(255,180,90,.28);
    animation:spin 9s linear infinite;transform:rotate(24deg) scaleY(.34)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes spin{to{transform:rotate(384deg) scaleY(.34)}}
  .ld-title{font-size:19px;letter-spacing:6px;font-weight:300;color:#dfe9ff}
  .ld-title b{font-weight:600;letter-spacing:2px}
  .ld-bar{width:min(360px,66vw);height:2px;background:rgba(120,165,235,.18);border-radius:2px;overflow:hidden}
  .ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3f7fe0,#7fd4ff,#ffc46b);
    transition:width .3s ease;box-shadow:0 0 12px rgba(120,200,255,.8)}
  #loadtext{font-size:12px;color:var(--muted);letter-spacing:.5px;min-height:16px}

  /* ---------- 通用 ---------- */
  .glass{background:var(--panel);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:14px}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ---------- 顶栏 ---------- */
  #hud-top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;
    justify-content:space-between;padding:0 20px;z-index:20;pointer-events:none}
  .brand{display:flex;align-items:center;gap:11px;pointer-events:auto}
  .brand .bdot{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3cf,#ffab33 55%,#e2600f);
    box-shadow:0 0 14px rgba(255,170,60,.9)}
  .brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:1.5px}
  .brand em{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:2.4px;margin-left:4px;text-transform:uppercase}
  .tools{display:flex;gap:8px;pointer-events:auto}
  .tbtn{height:34px;padding:0 13px;border-radius:9px;font-size:12.5px;color:#cfdcf2;
    background:rgba(14,22,38,.66);border:1px solid var(--line);backdrop-filter:blur(12px);
    display:flex;align-items:center;gap:6px;transition:.18s}
  .tbtn:hover{background:rgba(30,48,78,.8);border-color:var(--line-strong);color:#fff}
  .tbtn.off{opacity:.42}
  .tbtn .ti{font-size:12px;opacity:.85}

  /* ---------- 左侧列表 ---------- */
  #left{position:fixed;left:18px;top:72px;width:206px;max-height:calc(100vh - 168px);z-index:18;
    padding:12px 8px 10px;display:flex;flex-direction:column;overflow:hidden}
  .panel-cap{font-size:10.5px;letter-spacing:2.4px;color:var(--muted);padding:0 8px 9px;text-transform:uppercase}
  #bodylist{overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
  #bodylist::-webkit-scrollbar{width:5px}
  #bodylist::-webkit-scrollbar-thumb{background:rgba(120,165,235,.24);border-radius:4px}
  .body-group{margin-bottom:1px}
  .body-item{display:flex;align-items:center;gap:8px;height:31px;padding:0 8px;border-radius:8px;
    cursor:pointer;font-size:13px;color:#c8d6ea;transition:.15s;position:relative;white-space:nowrap}
  .body-item:hover{background:rgba(90,140,220,.14);color:#fff}
  .body-item.active{background:linear-gradient(90deg,rgba(90,150,240,.28),rgba(90,150,240,.06));color:#fff}
  .body-item.active:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
  .body-item .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 7px currentColor}
  .body-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
  .body-item .cnt{font-size:10px;color:var(--muted);background:rgba(120,165,235,.12);
    border-radius:20px;padding:1px 6px;line-height:1.4}
  .body-item .arw{font-size:13px;color:var(--muted);transition:transform .2s;margin-left:1px}
  .body-group.open>.body-item .arw{transform:rotate(90deg)}
  .moons{display:none;margin:1px 0 5px 17px;padding-left:8px;border-left:1px solid rgba(120,165,235,.14)}
  .body-group.open .moons{display:block}
  .body-item.moon{height:27px;font-size:12.2px;color:#a8b8d0;padding-left:6px}
  .body-item.moon .mi{width:4px;height:4px;border-radius:50%;background:rgba(160,190,230,.6);flex:0 0 auto}
  .side-sep{font-size:9.5px;letter-spacing:2px;color:rgba(143,163,194,.72);padding:12px 8px 5px;
    margin-top:6px;border-top:1px solid var(--line)}
  .body-item.comet .dot{border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    box-shadow:0 0 9px rgba(143,233,255,.9)}

  /* ---------- 右侧信息 ---------- */
  #right{position:fixed;right:18px;top:72px;width:376px;z-index:18;display:flex;flex-direction:column;
    max-height:calc(100vh - 168px);height:auto}
  #info{overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 22px;min-height:0}
  #info::-webkit-scrollbar{width:5px}
  #info::-webkit-scrollbar-thumb{background:rgba(120,165,235,.24);border-radius:4px}
  .info-head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
  .ih-title{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .ih-title h2{margin:0;font-size:24px;font-weight:600;letter-spacing:1px;
    background:linear-gradient(120deg,#fff,#a9c8f0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ih-title span{font-size:11.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}
  .ih-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .tag{font-size:10.5px;padding:3px 9px;border-radius:20px;color:#a9cbff;
    background:rgba(90,150,240,.14);border:1px solid rgba(90,150,240,.24);letter-spacing:.6px}
  .tag.sm{color:#c9b5ff;background:rgba(150,120,255,.12);border-color:rgba(150,120,255,.22)}
  .backlink{font-size:12px;color:var(--accent);padding:4px 0 8px;display:inline-block}
  .backlink:hover{color:#fff}
  .sec{margin-bottom:16px}
  .sec h4{margin:0 0 8px;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:500;text-transform:uppercase;
    display:flex;align-items:baseline;gap:8px}
  .sec h4 .hint{font-size:10px;letter-spacing:0;color:rgba(140,170,210,.7);text-transform:none}
  .sgrid{display:flex;flex-direction:column;gap:0}
  .srow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12.6px;
    border-bottom:1px dashed rgba(120,165,235,.09)}
  .srow:last-child{border-bottom:none}
  .srow span{color:var(--muted);flex:0 0 84px}
  .srow b{font-weight:500;color:#dce8fa;text-align:right;line-height:1.45}
  .desc{margin:0;font-size:13.2px;line-height:1.85;color:#c3d3e8}
  .facts{margin:0;padding-left:15px;font-size:12.8px;line-height:1.9;color:#b8c9e0}
  .facts li{margin-bottom:3px}
  .facts li::marker{color:var(--accent)}

  #info-close{display:none;position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;
    align-items:center;justify-content:center;font-size:11px;color:#9fb4d0;background:rgba(20,32,52,.9);
    border:1px solid var(--line);z-index:3}
  /* 地球模块 */
  .earth-mod{border:1px solid rgba(53,224,255,.16);border-radius:12px;padding:13px;background:rgba(20,60,90,.14)}
  .comet-mod{border:1px solid rgba(143,233,255,.18);border-radius:12px;padding:13px;background:rgba(26,64,96,.16)}
  .comet-mod .srow{border-bottom:1px dashed rgba(143,233,255,.1)}
  .comet-mod .srow b{color:#dff6ff}
  .coord{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-bottom:11px}
  .crow{display:flex;flex-direction:column;gap:2px;min-width:0}
  .crow label{font-size:10px;letter-spacing:1px;color:rgba(140,175,215,.8)}
  .crow b,.crow .v{font-size:13px;font-weight:600;color:#eaf4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow.full{grid-column:1/-1}
  .crow .v small{display:block;font-size:10px;font-weight:400;color:rgba(150,185,225,.75);letter-spacing:.3px}
  .crow .v.land{color:#7fe3a8}
  .crow .v.sea{color:#5fc8ff}
  #minimap{width:100%;height:auto;border-radius:8px;display:block;margin-bottom:10px;
    border:1px solid rgba(53,224,255,.16);background:#08121f}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;padding:4px 10px;border-radius:8px;color:#b6cbe4;background:rgba(90,140,210,.12);
    border:1px solid rgba(90,140,210,.2);transition:.15s}
  .chip:hover{background:rgba(110,170,250,.24);color:#fff;border-color:rgba(120,180,255,.5)}

  .empty-info{padding:8px 2px}
  .ei-icon{font-size:22px;color:var(--accent);opacity:.8;margin-bottom:6px}
  .empty-info h3{margin:0 0 8px;font-size:16px;font-weight:500}
  .empty-info p{margin:0 0 14px;font-size:12.8px;color:var(--muted);line-height:1.8}
  .ei-tips{margin:0;padding-left:0;list-style:none;font-size:12.2px;color:#a9bdd8;line-height:1.85}
  .ei-tips li{padding-left:14px;position:relative;margin-bottom:8px}
  .ei-tips li:before{content:"·";position:absolute;left:2px;color:var(--accent);font-weight:700}

  /* ---------- 底栏 ---------- */
  #bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:19;
    display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:30px;
    background:rgba(10,16,28,.82);border:1px solid var(--line);backdrop-filter:blur(16px)}
  .play{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#2f6fd0,#5aa8ff);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
    box-shadow:0 2px 12px rgba(60,130,240,.45);flex:0 0 auto;transition:.18s;font-weight:600;letter-spacing:1px}
  .play:hover{filter:brightness(1.12)}
  .play.paused{background:linear-gradient(140deg,#3a4a63,#5b7392)}
  .rbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:#b9cbe4;
    display:flex;align-items:center;justify-content:center;font-size:12px;transition:.16s;flex:0 0 auto}
  .rbtn:hover{background:rgba(90,140,220,.2);color:#fff}
  #speed{width:168px;-webkit-appearance:none;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#4b8ce0,#7fd4ff)}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;box-shadow:0 0 10px rgba(120,200,255,.95);cursor:pointer}
  #speed::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff;cursor:pointer}
  #speedlabel{font-size:11.5px;color:#a9c4e2;min-width:82px;letter-spacing:.4px}
  .vline{width:1px;height:20px;background:var(--line)}
  #date{font-size:12.5px;color:#cfdcef;letter-spacing:.6px;font-variant-numeric:tabular-nums;
    min-width:132px;white-space:nowrap}
  #now{font-size:11.5px;color:var(--accent);padding:4px 8px;border-radius:7px;border:1px solid rgba(111,182,255,.22)}
  #now:hover{background:rgba(111,182,255,.14);color:#fff}

  /* ---------- 标签 / 提示 ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;pointer-events:auto;
    cursor:pointer;padding:2px 7px 2px 5px;border-radius:20px;font-size:11.5px;color:#d5e5fb;
    white-space:nowrap;transition:color .15s;text-shadow:0 1px 6px rgba(0,0,0,.9)}
  .lbl i{width:4px;height:4px;border-radius:50%;opacity:.85;flex:0 0 auto}
  .lbl span{letter-spacing:.5px}
  .lbl:hover{color:#fff}
  .lbl:hover span{text-decoration:underline;text-underline-offset:3px}
  .lbl.lbl-sel{color:#fff}
  .lbl.lbl-sel span{font-weight:600}
  .lbl-moon{font-size:10.5px;opacity:.8}

  #pinlabel{position:fixed;left:0;top:0;z-index:13;display:none;pointer-events:none;
    font-size:11px;padding:3px 8px;border-radius:6px;color:#dffaff;white-space:nowrap;
    background:rgba(10,40,60,.82);border:1px solid rgba(53,224,255,.45);
    box-shadow:0 4px 18px rgba(0,0,0,.5);letter-spacing:.4px}

  #toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:30;
    font-size:12.5px;padding:8px 16px;border-radius:20px;color:#dbe9ff;opacity:0;pointer-events:none;
    background:rgba(14,24,42,.9);border:1px solid var(--line);transition:.3s;backdrop-filter:blur(10px)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #hint{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:15;font-size:12px;
    color:#9fb4d0;padding:7px 15px;border-radius:20px;background:rgba(12,20,34,.7);
    border:1px solid var(--line);backdrop-filter:blur(8px);transition:opacity .8s;
    white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
  #hint.gone{opacity:0;pointer-events:none}
  #hint b{color:#cfe2ff;font-weight:500}

  #mobile-nav{display:none}

  @media (max-width:1100px){
    #left{width:176px}
    #right{width:320px}
  }
  @media (max-width:860px){
    #left{display:none}
    #left.open{display:flex;z-index:25;width:210px}
    #right{left:10px;right:10px;width:auto;top:auto;bottom:74px;height:44vh;
      border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px)}
    #info{padding:14px}
    #right.hide{display:none}
    #info-close{display:flex}
    .brand em{display:none}
    .tbtn{height:31px;padding:0 9px;font-size:11.5px}
    .tbtn span.tl{display:none}
    #hud-top{padding:0 12px;height:56px}
    #bottom{gap:8px;padding:7px 12px;bottom:10px;width:calc(100% - 20px);justify-content:center}
    #speed{width:88px}
    #speedlabel{min-width:60px;font-size:10.5px}
    #date{min-width:0;font-size:11px}
    .vline{display:none}
    #mobile-nav{display:flex;position:fixed;left:12px;bottom:auto;top:58px;z-index:26;
      height:32px;padding:0 12px;border-radius:16px;align-items:center;gap:6px;font-size:11.5px;
      background:rgba(14,24,42,.9);border:1px solid var(--line);backdrop-filter:blur(10px)}
    #hint{white-space:normal;text-align:center;font-size:10.5px;line-height:1.6;top:96px;
      max-width:88vw;border-radius:12px}
    #date{display:none}
    #now{padding:3px 6px;font-size:10.5px;white-space:nowrap}
    #speed{width:78px}
    #toast{bottom:auto;top:120px}
    .srow span{flex:0 0 74px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="pinlabel"></div>

<header id="hud-top">
  <div class="brand">
    <span class="bdot"></span>
    <h1>太阳系探索器<em>Solar System</em></h1>
  </div>
  <div class="tools">
    <button class="tbtn" id="btn-labels"><span class="ti">◎</span><span class="tl">名称</span></button>
    <button class="tbtn" id="btn-orbits"><span class="ti">◯</span><span class="tl">轨道</span></button>
    <button class="tbtn" id="btn-belt"><span class="ti">⁙</span><span class="tl">小行星带</span></button>
    <button class="tbtn" id="btn-view"><span class="ti">⊤</span><span class="tl">俯视黄道</span></button>
    <button class="tbtn" id="btn-reset"><span class="ti">⟲</span><span class="tl">重置</span></button>
  </div>
</header>

<aside id="left" class="glass">
  <div class="panel-cap">天体导航</div>
  <div id="bodylist"></div>
</aside>

<aside id="right" class="glass">
  <button id="info-close" title="收起">✕</button>
  <div id="info"></div>
</aside>

<div id="mobile-nav">☰ 天体</div>

<footer id="bottom">
  <button class="play" id="play">暂停</button>
  <button class="rbtn" id="rev" title="反向时间">⇆</button>
  <div class="vline"></div>
  <input type="range" id="speed" min="0" max="1000" value="470">
  <span id="speedlabel">6.98 天/秒</span>
  <div class="vline"></div>
  <span id="date">----</span>
  <button id="now">回到现在</button>
</footer>

<div id="hint"><b>拖动</b> 旋转 · <b>滚轮</b> 缩放 · <b>点击天体</b> 查看资料 · 选中地球后点击地表取经纬度</div>
<div id="toast"></div>

<div id="loading">
  <div class="ld-orb"></div>
  <div class="ld-title"><b>太阳系</b> 探索器</div>
  <div class="ld-bar"><i id="loadbar"></i></div>
  <div id="loadtext">正在初始化星空…</div>
</div>

<script src="vendor/three.min.js"></script>
<script src="data/geo.js"></script>
<script src="js/data.js"></script>
<script src="js/textures.js"></script>
<script src="js/app.js"></script>
<script>
  // 移动端：左栏抽屉开关
  document.getElementById('mobile-nav').addEventListener('click', function(){
    var l = document.getElementById('left');
    l.classList.toggle('open');
  });
</script>
</body>
</html>
